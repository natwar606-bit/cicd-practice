name: Phase 2 CI Practice

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      APP_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "APP_ENV=$APP_ENV"

      - name: Build artifact
        run: |
          mkdir -p build
          echo "CI/CD Phase 2 artifact" > build/build-info.txt
          echo "Commit: $GITHUB_SHA" >> build/build-info.txt
          echo "Environment: $APP_ENV" >> build/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-build-artifact
          path: build/build-info.txt
      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
          fi
